services:
  postgres:
    container_name: antiplag-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: antiplag
      POSTGRES_USER: antiplag
      POSTGRES_PASSWORD: antiplag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antiplag -d antiplag"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  file-storage:
    container_name: antiplag-file-storage
    build:
      context: .
      dockerfile: Antiplag.FileStorage/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8001:8080"
    volumes:
      - filestorage_data:/app/files
    restart: unless-stopped

  analysis:
    container_name: antiplag-analysis
    build:
      context: .
      dockerfile: Antiplag.Analysis/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Services__FileStorage: http://file-storage:8080
      ConnectionStrings__AnalysisDb: Host=postgres;Port=5432;Database=antiplag;Username=antiplag;Password=antiplag
    depends_on:
      - file-storage
      - postgres
    ports:
      - "8002:8080"
    restart: unless-stopped

  gateway:
    container_name: antiplag-gateway
    build:
      context: .
      dockerfile: Antiplag.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Services__FileStorage: http://file-storage:8080
      Services__Analysis: http://analysis:8080
    depends_on:
      - file-storage
      - analysis
    ports:
      - "8000:8080"
    restart: unless-stopped

volumes:
  filestorage_data:
  postgres_data: